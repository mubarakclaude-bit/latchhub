name: Test and deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, gd, mbstring, pdo_sqlite, sqlite3, exif, fileinfo
      - name: PHP syntax check
        run: find api tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Connector tests (fake Zoho, no real credentials)
        run: PHP=php bash tests/run-tests.sh

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      # folder on Hostinger, relative to the SSH user's home directory
      REMOTE_DIR: domains/latchinfinity.com/public_html/LatchHub/
    steps:
      - uses: actions/checkout@v5
      - name: Check deploy secrets exist
        env:
          HOST: ${{ secrets.HOSTINGER_SFTP_HOST }}
          PORT: ${{ secrets.HOSTINGER_SFTP_PORT }}
          USER_NAME: ${{ secrets.HOSTINGER_SFTP_USERNAME }}
          KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
        run: |
          for v in HOST PORT USER_NAME KEY; do
            if [ -z "${!v}" ]; then echo "::error::Missing GitHub secret for $v (HOSTINGER_SFTP_HOST / _PORT / _USERNAME / HOSTINGER_SSH_PRIVATE_KEY)"; exit 1; fi
          done
      - name: Upload changed files over SSH (rsync)
        env:
          HOST: ${{ secrets.HOSTINGER_SFTP_HOST }}
          PORT: ${{ secrets.HOSTINGER_SFTP_PORT }}
          USER_NAME: ${{ secrets.HOSTINGER_SFTP_USERNAME }}
          KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          rsync -az --chmod=D755,F644 --stats \
            -e "ssh -i $HOME/.ssh/id_deploy -p $PORT -o IdentitiesOnly=yes" \
            --exclude='.git' --exclude='.github' --exclude='tests' --exclude='docs' \
            --exclude='README.md' --exclude='lh-config.sample.php' --exclude='.DS_Store' \
            ./ "$USER_NAME@$HOST:$REMOTE_DIR"
          rm -f ~/.ssh/id_deploy
