name: Test and deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, gd, mbstring, pdo_sqlite, sqlite3, exif, fileinfo
      - name: PHP syntax check
        run: find api tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Connector tests (fake Zoho, no real credentials)
        run: PHP=php bash tests/run-tests.sh

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check deploy secrets exist
        env:
          S: ${{ secrets.FTP_SERVER }}
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
        run: |
          for v in S U P; do
            if [ -z "${!v}" ]; then echo "::error::Missing GitHub secret (FTP_SERVER, FTP_USERNAME, FTP_PASSWORD). See docs/ZOHO-SETUP.md"; exit 1; fi
          done
      - name: Upload changed files to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: ${{ secrets.FTP_SERVER_DIR || './' }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            tests/**
            docs/**
            README.md
            lh-config.sample.php
