<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LatchHub admin</title>
<style>
:root{color-scheme:light;--bg:#f6f6f7;--panel:#fff;--line:#dcdce0;--ink:#16161a;--mute:#6b6b74;--ok:#15803d;--bad:#b91c1c}   /* dark theme is off for now */
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:28px 16px 60px}h1{font-size:24px;margin:0 0 4px}h2{font-size:16px;margin:26px 0 8px}.sub{color:var(--mute);margin:0 0 18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
input,select,button{font:inherit;padding:9px 11px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}button{cursor:pointer;background:var(--ink);color:var(--bg);border:0;font-weight:600}button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row input{flex:1;min-width:150px}.mute{color:var(--mute)}.ok{color:var(--ok)}.bad{color:var(--bad)}
table{width:100%;border-collapse:collapse}td{padding:8px 4px;border-top:1px solid var(--line);vertical-align:middle}.msg{min-height:20px;margin:8px 0}
</style></head><body><main>
<h1>LatchHub admin</h1><p class="sub">Sign in, check the Zoho connection and manage the team.</p>
<div id="app"></div></main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let csrf='',me=null;
async function api(path,body){const o={credentials:'same-origin',headers:{}};if(body!==undefined){o.method='POST';o.headers['Content-Type']='application/json';o.headers['X-LH-CSRF']=csrf;o.body=JSON.stringify(body)}
  const r=await fetch('api/'+path,o);let j={};try{j=await r.json()}catch{}if(!r.ok)throw Object.assign(new Error(j.error||('Error '+r.status)),{status:r.status});return j}
async function boot(){try{const j=await api('me.php');me=j.user;csrf=j.csrf;home()}catch{login()}}
function login(msg=''){$('#app').innerHTML=`<div class="card"><h2 style="margin-top:0">Sign in</h2><form id="f" class="row"><input id="e" type="email" placeholder="Email" required autocomplete="username"><input id="p" type="password" placeholder="Password" required autocomplete="current-password"><button>Sign in</button></form><div class="msg bad">${esc(msg)}</div></div>`;
  $('#f').onsubmit=async ev=>{ev.preventDefault();try{const j=await api('login.php',{email:$('#e').value,password:$('#p').value});me=j.user;csrf=j.csrf;home()}catch(e){login(e.message)}}}
async function home(){
  if(me.role!=='admin'){$('#app').innerHTML=`<div class="card">Signed in as ${esc(me.name)} (designer). Only the admin can use this page.<p><button class="ghost" id="lo">Sign out</button></p></div>`;$('#lo').onclick=out;return}
  $('#app').innerHTML=`<div class="row" style="justify-content:space-between"><span class="mute">Signed in as <b>${esc(me.name)}</b> (admin)</span><button class="ghost" id="lo">Sign out</button></div>
  <h2>Zoho connection</h2><div class="card"><button id="hc">Run health check</button><div id="hr" class="msg"></div></div>
  <div class="card"><button id="st" class="ghost">Test a real upload &amp; download</button> <span class="mute">creates a small test file in Zoho</span><div id="sr" class="msg"></div></div>
  <h2>Team</h2><div class="card"><table id="tt"></table></div>
  <h2>Activity</h2><div class="card"><div class="mute" style="margin-bottom:6px">Everything people do in LatchHub: sign-ins, uploads, client changes, deletes, downloads, checks and errors. Times are in your local time.</div><div class="row" id="af"><select id="au"><option value="">Everyone</option></select><select id="aa"><option value="">All actions</option></select><input id="ac" placeholder="Client name"><input id="afr" type="date" title="From"><input id="ato" type="date" title="To"><button class="ghost" id="ago">Search</button><button class="ghost" id="acsv">Download CSV</button></div><table id="al" style="margin-top:8px"></table><div class="row" style="margin-top:8px"><button class="ghost" id="amore" hidden>Load more</button><span class="mute" id="aend"></span></div></div>
  <h2>Zoho clean-up queue</h2><div class="card"><div class="mute" style="margin-bottom:6px">Files or folders that LatchHub tried to move to the WorkDrive trash but Zoho did not accept yet, with Zoho\'s own answer. Empty means everything was cleaned up.</div><div id="pq"></div><div class="row" style="margin-top:8px"><button class="ghost" id="pr">Retry now</button></div></div>
  <h2>Deleted clients</h2><div class="card"><div class="mute" style="margin-bottom:6px">Deleting a client moves its Zoho folder to the WorkDrive trash. Restore brings back the client and its folder (Zoho keeps trashed items only for the retention period set in WorkDrive).</div><div id="dc"></div></div>
  <h2>Add a person</h2><div class="card"><form id="nf" class="row"><input id="nn" placeholder="Name" required><input id="ne" type="email" placeholder="Email" required><select id="nr"><option value="designer">Designer</option><option value="admin">Admin</option></select><input id="np" type="password" placeholder="Password (10+ chars)" minlength="10" required><button>Add</button></form><div id="nm" class="msg"></div></div>`;
  $('#lo').onclick=out;$('#hc').onclick=health;$('#st').onclick=selftest;deleted();pending();$('#pr').onclick=async()=>{try{const r=await api('brands.php',{action:'retry_pending'});alert(r.done+' moved to the trash, '+r.failed+' still refused.');pending()}catch(e){alert(e.message)}};$('#nf').onsubmit=addUser;team();activityInit()}
async function out(){try{await api('logout.php',{})}catch{}me=null;login()}
async function health(){$('#hr').textContent='Checking…';try{const j=await api('health.php');$('#hr').innerHTML=`<div class="${j.all_ok?'ok':'bad'}"><b>${j.all_ok?'Everything required is working.':'Something needs attention.'}</b></div><table>`+j.checks.map(c=>`<tr><td class="${c.ok?'ok':'bad'}">${c.ok?'✓':'✕'}</td><td>${esc(c.check)}</td><td class="mute">${esc(c.note)}</td></tr>`).join('')+`</table>`}catch(e){$('#hr').innerHTML=`<span class="bad">${esc(e.message)}</span>`}}
async function selftest(){$('#sr').textContent='Testing – creating a folder, uploading, downloading…';try{const j=await api('selftest.php',{});$('#sr').innerHTML=`<div class="${j.all_ok?'ok':'bad'}"><b>${j.all_ok?'Uploading and downloading work.':'A step failed – details below.'}</b></div><table>`+j.steps.map(c=>`<tr><td class="${c.ok?'ok':'bad'}">${c.ok?'✓':'✕'}</td><td>${esc(c.step)}</td><td class="mute">${esc(c.note)}</td></tr>`).join('')+`</table>`}catch(e){$('#sr').innerHTML=`<span class="bad">${esc(e.message)}</span>`}}
async function pending(){try{const j=await api('brands.php?pending=1');$('#pq').innerHTML=j.pending.length?`<table>`+j.pending.map(p=>`<tr><td><b>${esc(p.kind)}</b> <span class="mute">${esc(p.zoho_id)}</span><br><span class="mute">${esc(p.created_at)} · tried ${+p.tries} time(s)</span></td><td class="bad" style="font-size:12px">${esc(p.reason)}</td></tr>`).join('')+`</table>`:'<span class="ok">Nothing waiting.</span>'}catch(e){$('#pq').innerHTML=`<span class="bad">${esc(e.message)}</span>`}}
async function deleted(){try{const j=await api('brands.php?deleted=1');$('#dc').innerHTML=j.deleted.length?`<table>`+j.deleted.map(d=>`<tr><td><b>${esc(d.name)}</b><br><span class="mute">deleted ${esc(d.deleted_at)}${d.by_name?' by '+esc(d.by_name):''}</span></td><td style="text-align:right"><button class="ghost" data-rs="${esc(d.id)}">Restore</button></td></tr>`).join('')+`</table>`:'<span class="mute">None.</span>';
  $('#dc').querySelectorAll('[data-rs]').forEach(b=>b.onclick=async()=>{if(!confirm('Restore this client and its Zoho folder?'))return;try{await api('brands.php',{action:'restore',id:b.dataset.rs});alert('Restored. Designers will see it again within a minute.');deleted()}catch(e){alert(e.message)}})}catch(e){$('#dc').innerHTML=`<span class="bad">${esc(e.message)}</span>`}}
const ALAB={login:'Signed in',logout:'Signed out',login_failed:'Failed sign-in',login_blocked:'Sign-in locked',client_created:'Client created',client_updated:'Client changed',client_deleted:'Client deleted',client_restored:'Client restored',file_uploaded:'File uploaded',svg_download:'SVG/PNG downloaded',lens_check:'Design Lens check',logo_variants:'White/grey logos made',client_error:'Error on screen',cleanup_retry:'Clean-up retried',user_created:'Person added',password_reset:'Password reset',user_switched_off:'Person switched off',user_switched_on:'Person switched on',selftest:'Upload test'};
const ABAD=new Set(['login_failed','login_blocked','client_error']);
let aBefore=null,aUsers={};
const local=s=>{const d=new Date(String(s).replace(' ','T')+'Z');return isNaN(d)?s:d.toLocaleString([], {day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})};
function aq(extra){const p=new URLSearchParams();if($('#au').value)p.set('user',$('#au').value);if($('#aa').value)p.set('action',$('#aa').value);if($('#ac').value.trim())p.set('client',$('#ac').value.trim());if($('#afr').value)p.set('from',$('#afr').value);if($('#ato').value)p.set('to',$('#ato').value);for(const k in extra||{})p.set(k,extra[k]);return p.toString()}
async function activityInit(){try{const [u,a]=await Promise.all([api('users.php'),api('activity.php?actions=1')]);u.users.forEach(x=>{$('#au').insertAdjacentHTML('beforeend',`<option value="${x.id}">${esc(x.name)}</option>`)});a.actions.forEach(x=>{$('#aa').insertAdjacentHTML('beforeend',`<option value="${esc(x)}">${esc(ALAB[x]||x)}</option>`)})}catch{}
  $('#ago').onclick=()=>activityLoad(true);$('#amore').onclick=()=>activityLoad(false);$('#acsv').onclick=()=>{location.href='api/activity.php?'+aq({format:'csv'})};activityLoad(true)}
async function activityLoad(reset){try{if(reset){aBefore=null;$('#al').innerHTML=''}const j=await api('activity.php?'+aq(aBefore?{before:aBefore}:{}));
  $('#al').insertAdjacentHTML('beforeend',j.events.map(e=>`<tr><td class="mute" style="white-space:nowrap">${esc(local(e.at))}</td><td><b>${esc(e.user_name||'—')}</b>${e.role?` <span class="mute">${esc(e.role)}</span>`:''}</td><td class="${ABAD.has(e.action)?'bad':''}">${esc(ALAB[e.action]||e.action)}${e.client_name?`<br><span class="mute">${esc(e.client_name)}</span>`:''}</td><td class="mute" style="font-size:12px">${esc(e.details)}</td></tr>`).join(''));
  aBefore=j.next;$('#amore').hidden=!j.next;$('#aend').textContent=$('#al').rows.length?(j.next?'':'End of the list.'):'Nothing recorded yet.'}catch(e){$('#aend').innerHTML=`<span class="bad">${esc(e.message)}</span>`}}
async function team(){const j=await api('users.php');let sm={};try{sm=(await api('activity.php?summary=1')).summary}catch{}aUsers=sm;$('#tt').innerHTML=j.users.map(u=>`<tr><td><b>${esc(u.name)}</b><br><span class="mute">${esc(u.email)}</span></td><td>${esc(u.role)}</td><td class="${+u.active?'ok':'bad'}">${+u.active?'active':'off'}<br><span class="mute" style="font-size:11px">${sm[u.id]?'last seen '+esc(local(sm[u.id].last_at))+'<br>30 days: '+(+sm[u.id].logins)+' sign-ins, '+(+sm[u.id].uploads)+' uploads, '+(+sm[u.id].changes)+' changes':'no activity yet'}</span></td><td style="text-align:right"><button class="ghost" data-pw="${u.id}">New password</button> <button class="ghost" data-act="${u.id}" data-on="${+u.active?0:1}">${+u.active?'Switch off':'Switch on'}</button></td></tr>`).join('');
  $('#tt').querySelectorAll('[data-pw]').forEach(b=>b.onclick=async()=>{const p=prompt('New password (10+ characters):');if(!p)return;try{await api('users.php',{action:'password',id:+b.dataset.pw,password:p});alert('Password changed.')}catch(e){alert(e.message)}});
  $('#tt').querySelectorAll('[data-act]').forEach(b=>b.onclick=async()=>{try{await api('users.php',{action:'active',id:+b.dataset.act,active:+b.dataset.on});team()}catch(e){alert(e.message)}})}
async function addUser(ev){ev.preventDefault();try{await api('users.php',{action:'create',name:$('#nn').value,email:$('#ne').value,role:$('#nr').value,password:$('#np').value});$('#nf').reset();$('#nm').innerHTML='<span class="ok">Added.</span>';team()}catch(e){$('#nm').innerHTML=`<span class="bad">${esc(e.message)}</span>`}}
boot();
</script></body></html>
