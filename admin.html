<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LatchHub admin</title>
<link rel="icon" type="image/svg+xml" href="assets/latchhub/favicon.svg">
<style>
/* LatchHub admin – same flat, square, Helvetica language as the app and its sign-in page. Light only (dark theme is off platform-wide). */
:root{color-scheme:light;
  --bg:#f4f4f2;--panel:#fff;--alt:#f1f1ef;--ink:#101010;--ink2:#4a4a47;--mute:#7c7c79;--line:#e4e4e0;--line2:#c9c9c5;--red:#ff4b2b;--side:#101010;--sidemute:#8d8d89;
  --ok:#0c7a0c;--crit:#d03b3b;
  /* activity sections – categorical slots in fixed order (validated: CVD & normal-vision separation pass; light slots 3–5 are below 3:1, so every chart has labels or a table view) */
  --c-view:#2a78d6;--c-download:#eb6834;--c-customise:#1baf7a;--c-edit:#eda100;--c-delete:#e87ba4;--c-add:#008300;--c-check:#6250d6;
  --c-auth:#a3a39e;--c-admin:#5f5f5b;--c-error:#d03b3b;
  /* sequential (heat map) – one hue, light → dark */
  --s1:#cde2fb;--s2:#9ec5f4;--s3:#6da7ec;--s4:#3987e5;--s5:#256abf;--s6:#184f95;--s7:#0d366b}
*{box-sizing:border-box;margin:0;border-radius:0}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 "Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
.cap{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-weight:500}
.mute{color:var(--mute)}.ok{color:var(--ok)}.bad{color:var(--crit)}
.num{font-variant-numeric:tabular-nums}

/* ---------- sign in ---------- */
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr;background:#101010;color:#fff}
.login .art{background:var(--red);position:relative;overflow:hidden;padding:36px}
.login .art h1{position:absolute;left:30px;bottom:-3vw;font-size:15vw;font-weight:500;letter-spacing:-.06em;line-height:1}
.login .card{display:flex;flex-direction:column;justify-content:center;padding:0 min(8vw,110px)}
.login h2{font-size:clamp(34px,4vw,54px);font-weight:500;letter-spacing:-.035em;text-transform:uppercase;line-height:.95;margin:10px 0 34px}
.login label{display:block;margin-top:20px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#9a9a96}
.login input{display:block;width:100%;font-size:16px;padding:10px 0;border:0;border-bottom:1px solid #444;background:none;color:#fff}.login input:focus{outline:0;border-color:var(--red)}
.login button{width:100%;margin-top:36px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:16px 20px;border:0;background:#fff;color:#000;display:flex;justify-content:space-between}.login button:hover{background:var(--red);color:#fff}
.login .err{min-height:20px;margin-top:14px;color:#ff8a73;font-size:13px}
@media(max-width:800px){.login{grid-template-columns:1fr;grid-template-rows:24vh 1fr}.login .art h1{font-size:24vw}.login .card{padding:36px 24px}}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.side{background:var(--side);color:#fff;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:26px 0 18px}
.brandmark{padding:0 24px 30px}.brandmark b{display:block;font-size:22px;font-weight:500;letter-spacing:-.04em}.brandmark span{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--sidemute)}
.nav{display:flex;flex-direction:column}
.nav button{display:flex;align-items:center;gap:12px;padding:11px 24px;border:0;background:none;color:#cfcfcb;text-align:left;font-size:13.5px;position:relative;transition:background .15s,color .15s}
.nav button svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6}
.nav button:hover{background:#1c1c1c;color:#fff}
.nav button.on{color:#fff;background:#1c1c1c}.nav button.on:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--red)}
.nav .badge{margin-left:auto;font-size:11px;background:var(--crit);color:#fff;padding:0 6px;min-width:18px;text-align:center}
.side .foot{margin-top:auto;padding:16px 24px 0;border-top:1px solid #262626;font-size:12.5px}
.side .foot b{display:block;font-weight:500;font-size:13.5px}.side .foot .mute{color:var(--sidemute);word-break:break-all}
.side .foot .links{display:flex;gap:14px;margin-top:12px}.side .foot a,.side .foot button{background:none;border:0;padding:0;color:#cfcfcb;text-decoration:underline;text-underline-offset:3px;font-size:12px}
.main{min-width:0;padding:30px clamp(16px,3.2vw,44px) 60px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:26px}
.top h1{font-size:clamp(28px,3.4vw,44px);font-weight:500;letter-spacing:-.035em;text-transform:uppercase;line-height:.95}
.top p{margin-top:8px;color:var(--ink2);max-width:620px}
.tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--ink);flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 12px;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.seg button+button{border-left:1px solid var(--ink)}
.seg button.on{background:var(--ink);color:#fff}
.btn{border:1px solid var(--ink);background:transparent;padding:7px 13px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;display:inline-flex;align-items:center;gap:6px;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--ink);color:#fff}
.btn.pri{background:var(--ink);color:#fff}.btn.pri:hover{background:var(--red);border-color:var(--red)}
.btn.sm{padding:4px 9px;font-size:10.5px}
.btn.ghost{border-color:var(--line2)}
.btn[disabled]{opacity:.5;cursor:default}
.stamp{font-size:12px;color:var(--mute)}
@media(max-width:900px){.shell{grid-template-columns:1fr}.side{position:sticky;top:0;z-index:30;height:auto;flex-direction:row;align-items:center;padding:0;overflow-x:auto}
  .brandmark{padding:12px 16px}.brandmark b{font-size:17px}.brandmark span{display:none}.nav{flex-direction:row}.nav button{padding:16px 12px;white-space:nowrap}.nav button span.t{display:none}.nav button.on:before{left:0;right:0;top:auto;bottom:0;width:auto;height:3px}.side .foot{display:none}
  .main{padding-top:22px}}

/* ---------- cards & grid ---------- */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g32{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
@media(max-width:1100px){.g32,.g2{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);padding:18px 20px;min-width:0}
.card>header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.card h3{font-size:15px;font-weight:600;letter-spacing:-.01em}
.card h3+p{font-size:12.5px;color:var(--mute);margin-top:2px}
.sp{height:16px}

/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
@media(max-width:1200px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--panel);padding:16px 18px 12px;border:0;text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0;transition:background .15s}
.kpi:hover{background:#fafaf8}
.kpi .v{font-size:32px;font-weight:500;letter-spacing:-.04em;line-height:1.05}
.kpi .d{font-size:11.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .d b{font-weight:600;color:var(--ink2)}
.kpi svg{display:block;width:100%;height:28px;margin-top:6px}
.kpi .lab{display:flex;align-items:center;gap:7px}
.dot{display:inline-block;width:9px;height:9px;flex:none}

/* charts */
.chart{position:relative;width:100%;min-height:250px}
.chart svg{display:block;width:100%;overflow:visible}
.axis text{font-size:10.5px;fill:var(--mute)}
.grid-l{stroke:var(--line);stroke-width:1}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:10px}
.legend button{border:0;background:none;padding:2px 0;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2)}
.legend button.off{opacity:.38}.legend button.off .dot{background:transparent!important;outline:1.5px solid var(--line2);outline-offset:-1.5px}
.tip{position:fixed;z-index:200;pointer-events:none;background:#101010;color:#fff;padding:9px 11px;font-size:12px;line-height:1.5;min-width:150px;max-width:280px;box-shadow:0 6px 24px rgba(0,0,0,.25);opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s}
.tip.on{opacity:1;transform:none}
.tip b{font-weight:600}.tip .r{display:flex;align-items:center;gap:12px;justify-content:space-between}.tip .r span:first-child{display:flex;align-items:center;gap:7px}
.tip .t{color:#a9a9a5;font-size:11px;margin-bottom:4px;letter-spacing:.04em}
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:left;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);font-weight:500;padding:8px;border-bottom:1px solid var(--ink);white-space:nowrap}
.tbl td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl td.n,.tbl th.n{text-align:right;font-variant-numeric:tabular-nums}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:#fafaf8}
.tbl th.sort{cursor:pointer}.tbl th.sort:hover{color:var(--ink)}
.scroll{overflow-x:auto}

/* horizontal bars */
.hbars{display:flex;flex-direction:column;gap:9px}
.hb{display:grid;grid-template-columns:minmax(110px,170px) 1fr 52px;align-items:center;gap:10px;border:0;background:none;padding:2px 0;text-align:left;font-size:12.5px;width:100%}
.hb:hover .tr{background:#ececea}
.hb .nm{display:flex;align-items:center;gap:7px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb .tr{height:12px;background:var(--alt);position:relative;transition:background .15s}
.hb .fi{position:absolute;left:0;top:0;bottom:0;animation:grow .7s cubic-bezier(.2,.7,.2,1) both;transform-origin:left}
@keyframes grow{from{transform:scaleX(0)}to{transform:none}}
.hb .ct{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink2)}
.stack{display:flex;height:10px;gap:2px;width:100%}
.stack i{display:block;height:100%;min-width:3px}
.stack.empty{background:var(--alt)}

/* heat map */
.heat{display:grid;grid-template-columns:34px repeat(24,minmax(0,1fr));gap:2px;font-size:10px;color:var(--mute)}
.heat .c{aspect-ratio:1/1;background:var(--alt);min-height:8px}
.heat .c:hover{outline:2px solid var(--ink);outline-offset:-1px}
.heat .rl{display:flex;align-items:center}
.heat .hl{text-align:center;padding-top:3px}
.scale{display:flex;align-items:center;gap:4px;margin-top:10px;font-size:11px;color:var(--mute);flex-wrap:wrap}.scale i{width:16px;height:9px;display:block}

/* people */
.av{width:34px;height:34px;flex:none;display:grid;place-items:center;background:var(--ink);color:#fff;font-size:12.5px;font-weight:600;letter-spacing:.02em}
.av.sm{width:26px;height:26px;font-size:10.5px}.av.lg{width:52px;height:52px;font-size:18px}
.av.off{background:var(--line2)}
.who{display:flex;align-items:center;gap:10px;min-width:0}.who>span{min-width:0}.who b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.who small{display:block;color:var(--mute);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow{display:grid;grid-template-columns:minmax(140px,1.3fr) 2fr 50px;gap:14px;align-items:center;padding:10px 6px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left}
.prow:hover{background:#fafaf8}
.prow:last-child{border-bottom:0}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:16px}
.pc{background:var(--panel);border:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:14px;transition:border-color .15s;min-width:0}
.pc:hover{border-color:var(--line2)}
.pc .h{display:flex;align-items:center;gap:12px}
.pc .h .who{flex:1}
.pill{font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border:1px solid var(--line2);color:var(--ink2);white-space:nowrap}
.pill.adm{border-color:var(--ink);background:var(--ink);color:#fff}
.pill.off{border-color:var(--crit);color:var(--crit)}
.pc .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pc .stats div{border-top:1px solid var(--line);padding-top:6px;min-width:0}.pc .stats b{display:block;font-size:20px;font-weight:500;letter-spacing:-.03em}.pc .stats span{font-size:11px;color:var(--mute)}
.pc .acts{display:flex;gap:6px;flex-wrap:wrap}
.spark{display:block;width:100%;height:34px}

/* activity feed */
.tabs{display:flex;overflow-x:auto;border-bottom:1px solid var(--ink);margin-bottom:16px;scrollbar-width:thin}
.tabs button{border:0;background:none;padding:10px 14px 11px;display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink2);white-space:nowrap;position:relative}
.tabs button .n{font-size:11px;color:var(--mute);font-variant-numeric:tabular-nums}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--ink);font-weight:600}.tabs button.on:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--tc,var(--ink))}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.filters input,.filters select{padding:8px 10px;border:1px solid var(--line2);background:var(--panel);min-width:0;max-width:100%}
.filters input:focus,.filters select:focus{outline:0;border-color:var(--ink)}
.filters .grow{flex:1;min-width:160px}
.day{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);padding:18px 0 6px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.day:first-child{padding-top:0}
.ev{display:grid;grid-template-columns:52px 30px minmax(0,1fr);gap:12px;align-items:start;padding:11px 0;border-bottom:1px solid var(--line);animation:in .35s ease both}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.ev .tm{font-size:11.5px;color:var(--mute);font-variant-numeric:tabular-nums;padding-top:6px;white-space:nowrap}
.ico{width:30px;height:30px;display:grid;place-items:center;color:#fff;flex:none}
.ico svg{width:55%;height:55%;stroke:currentColor;fill:none;stroke-width:2}
.ev .bd{min-width:0}
.ev .ln{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 7px}
.ev .ln .p{font-weight:600;border:0;background:none;padding:0}.ev .ln .p:hover{text-decoration:underline}
.ev .cl{font-size:11.5px;border:1px solid var(--line2);padding:0 6px;background:none;color:var(--ink2)}.ev .cl:hover{border-color:var(--ink);color:var(--ink)}
.ev .dt{font-size:12.5px;color:var(--ink2);margin-top:3px;word-break:break-word}
.ev .sec{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.feed.compact .ev{grid-template-columns:30px minmax(0,1fr) auto;padding:9px 0}.feed.compact .ev .tm{padding-top:2px}
.empty{padding:34px 0;text-align:center;color:var(--mute)}
.more{display:flex;justify-content:center;padding-top:16px}
@media(max-width:560px){.ev{grid-template-columns:30px minmax(0,1fr)}.ev .tm{grid-column:2;order:3;padding-top:0}}

/* drawer & dialogs */
.veil{position:fixed;inset:0;background:rgba(10,10,10,.42);z-index:90;opacity:0;transition:opacity .2s}
.veil.on{opacity:1}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--bg);z-index:100;transform:translateX(100%);transition:transform .28s cubic-bezier(.2,.7,.2,1);display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer .dh{background:var(--panel);padding:22px 24px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:center}
.drawer .db{padding:20px 24px;overflow-y:auto;flex:1}
.x{margin-left:auto;border:0;background:none;font-size:24px;line-height:1;padding:4px 8px}
.dlg{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%);opacity:0;z-index:110;background:var(--panel);width:min(420px,calc(100% - 32px));padding:22px;transition:transform .2s,opacity .2s;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.dlg.on{opacity:1;transform:translate(-50%,-50%)}
.dlg h3{font-size:16px;font-weight:600;margin-bottom:6px}
.dlg p{color:var(--mute);font-size:12.5px;margin-bottom:6px}
.dlg label{display:block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:12px 0 4px}
.dlg input,.dlg select{width:100%;padding:9px 10px;border:1px solid var(--line2);background:var(--panel)}
.dlg input:focus,.dlg select:focus{outline:0;border-color:var(--ink)}
.dlg .row{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.dlg .msg{min-height:18px;font-size:12.5px;margin-top:10px;color:var(--crit)}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:#fff;padding:11px 16px;font-size:13px;z-index:220;transition:all .2s;max-width:calc(100% - 32px);pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* clients */
.sw{display:flex;gap:2px}.sw i{width:11px;height:22px;display:block;border:1px solid rgba(0,0,0,.08)}
.cname{display:flex;align-items:center;gap:10px;white-space:nowrap}.cname.sub{padding-left:16px}.cname.sub:before{content:"↳";color:var(--mute);margin-right:-4px}
.checks td:first-child{width:28px;font-weight:700}
.stat-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
@media(max-width:700px){.stat-row{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat-row div{background:var(--panel);padding:14px 16px;min-width:0}.stat-row b{display:block;font-size:24px;font-weight:500;letter-spacing:-.03em}.stat-row span{font-size:11.5px;color:var(--mute)}
.skel{background:linear-gradient(90deg,var(--alt),#fafaf8,var(--alt));background-size:200% 100%;animation:sk 1.2s infinite;height:14px;margin:8px 0}
@keyframes sk{to{background-position:-200% 0}}
.fade{animation:in .3s ease both}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div id="app"></div><div class="tip" id="tip" role="tooltip"></div><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
/* ======================= basics ======================= */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let csrf='',me=null;
async function api(path,body){const o={credentials:'same-origin',headers:{}};if(body!==undefined){o.method='POST';o.headers['Content-Type']='application/json';o.headers['X-LH-CSRF']=csrf;o.body=JSON.stringify(body)}
  const r=await fetch('api/'+path,o);let j={};try{j=await r.json()}catch{}if(!r.ok)throw Object.assign(new Error(j.error||('Error '+r.status)),{status:r.status});return j}
const toast=(t,ms=3200)=>{const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),ms)};
const fmt=n=>(+n||0).toLocaleString();
const mb=b=>{b=+b||0;return b>=1073741824?(b/1073741824).toFixed(2)+' GB':b>=1048576?(b/1048576).toFixed(1)+' MB':Math.round(b/1024)+' KB'};
const utc=s=>s?new Date(String(s).replace(' ','T')+'Z'):null;
const tLocal=s=>{const d=utc(s);return d&&!isNaN(d)?d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):''};
const dLocal=s=>{const d=utc(s);return d&&!isNaN(d)?d.toLocaleString([],{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):String(s||'')};
const ago=s=>{const d=utc(s);if(!d||isNaN(d))return 'never';const m=Math.round((Date.now()-d)/60000);if(m<1)return 'just now';if(m<60)return m+' min ago';const h=Math.round(m/60);if(h<24)return h+' h ago';const dd=Math.round(h/24);return dd<30?dd+' day'+(dd>1?'s':'')+' ago':d.toLocaleDateString([],{day:'numeric',month:'short',year:'numeric'})};
const initials=n=>String(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase()||'?';

function moveTip(e){const r=tip.getBoundingClientRect(),pad=14;let x=e.clientX+pad,y=e.clientY+pad;if(x+r.width>innerWidth-8)x=e.clientX-r.width-pad;if(y+r.height>innerHeight-8)y=e.clientY-r.height-pad;tip.style.left=Math.max(8,x)+'px';tip.style.top=Math.max(8,y)+'px'}

function bindTips(root,fn){if(root._tips){root._tips=fn;return}root._tips=fn;

function sparkline(vals,color,cls){
  const n=vals.length;if(!n)return'';const max=Math.max(1,...vals),W=200,H=28;const x=i=>n<2?W/2:i*(W/(n-1)),y=v=>H-2-(v/max)*(H-6);
  const pts=vals.map((v,i)=>x(i).toFixed(1)+','+y(v).toFixed(1)).join(' ');
  return`<svg ${cls?`class="${cls}"`:''} viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><polygon points="0,${H} ${pts} ${W},${H}" fill="${color}" opacity=".12"/><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`}
/* buckets: days, or weeks when the period is long */
function buckets(daily){
  const f=d=>parseDay(d).toLocaleDateString([],{day:'numeric',month:'short'});
  if(daily.length<=45)return daily.map(d=>({k:d.d,label:f(d.d),long:parseDay(d.d).toLocaleDateString([],{weekday:'long',day:'numeric',month:'long'}),c:d.c}));
  const out=[];for(let i=0;i<daily.length;i+=7){const sl=daily.slice(i,i+7),c={};ALL_CATS.forEach(k=>c[k]=sl.reduce((a,d)=>a+(d.c[k]||0),0));
    out.push({k:sl[0].d,label:f(sl[0].d),long:'Week of '+f(sl[0].d)+' – '+f(sl[sl.length-1].d),c})}return out}
function niceMax(v){if(v<=4)return 4;const p=Math.pow(10,Math.floor(Math.log10(v))),m=v/p;return(m<=1?1:m<=2?2:m<=2.5?2.5:m<=5?5:10)*p}
function stackedColumns(el,daily){
  const B=buckets(daily),show=WORK.filter(c=>!st.hidden.has(c));
  const W=Math.max(300,el.clientWidth||700),H=250,ml=40,mr=6,mt=10,mb=26,iw=W-ml-mr,ih=H-mt-mb;
  const tot=B.map(b=>show.reduce((a,c)=>a+(b.c[c]||0),0)),max=niceMax(Math.max(1,...tot));
  const bw=iw/B.length,gap=Math.max(1,Math.min(6,bw*.28)),cw=Math.max(1,bw-gap),y=v=>mt+ih-(v/max)*ih;
  let g='';for(let i=0;i<=4;i++){const v=max*i/4,yy=y(v);g+=`<line class="grid-l" x1="${ml}" x2="${W-mr}" y1="${yy}" y2="${yy}"/><text x="${ml-8}" y="${yy+3.5}" text-anchor="end">${fmt(Math.round(v))}</text>`}
  let bars='',hits='';const every=Math.ceil(B.length/Math.max(2,Math.floor(iw/62)));
  B.forEach((b,i)=>{const x=ml+i*bw+gap/2;let acc=0;
    show.forEach(c=>{const v=b.c[c]||0;if(!v)return;const y0=y(acc),y1=y(acc+v),h=Math.max(0,y0-y1-(acc>0?2:0));if(h>0)bars+=`<rect x="${x.toFixed(2)}" y="${y1.toFixed(2)}" width="${cw.toFixed(2)}" height="${h.toFixed(2)}" fill="${col(c)}"/>`;acc+=v});
    hits+=`<rect data-tip="${i}" x="${(ml+i*bw).toFixed(2)}" y="${mt}" width="${bw.toFixed(2)}" height="${ih}" fill="transparent"/>`;
    if(i%every===0)g+=`<text x="${(x+cw/2).toFixed(1)}" y="${H-8}" text-anchor="middle">${esc(b.label)}</text>`});
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Actions per ${daily.length>45?'week':'day'}, stacked by section. A table view is available."><g class="axis">${g}</g>${bars}<line x1="${ml}" x2="${W-mr}" y1="${mt+ih}" y2="${mt+ih}" stroke="var(--ink)" stroke-width="1"/><g>${hits}</g></svg>`;
  bindTips(el,t=>{const b=B[+t.dataset.tip];if(!b)return'';const rows=show.slice().reverse().filter(c=>b.c[c]),tt=show.reduce((a,c)=>a+(b.c[c]||0),0);
    return`<div class="t">${esc(b.long)}</div>`+(rows.length?rows.map(c=>`<div class="r"><span><i class="dot" style="background:${col(c)}"></i>${CATS[c]}</span><b>${fmt(b.c[c])}</b></div>`).join('')+`<div class="r" style="border-top:1px solid #333;margin-top:4px;padding-top:4px"><span>Total</span><b>${fmt(tt)}</b></div>`:'No activity')})}
function heatmap(el,heat){
  const days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],long=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'],flat=heat.flat(),max=Math.max(0,...flat),steps=['--s1','--s2','--s3','--s4','--s5','--s6','--s7'];
  const step=v=>v<=0?null:steps[Math.min(6,Math.floor((v/max)*6.999))];
  let best=[0,0];heat.forEach((r,d)=>r.forEach((v,x)=>{if(v>heat[best[0]][best[1]])best=[d,x]}));
  let h='<span></span>';for(let x=0;x<24;x++)h+=`<span class="hl">${x%3===0?String(x).padStart(2,'0'):''}</span>`;
  const rows=heat.map((r,d)=>`<span class="rl">${days[d]}</span>`+r.map((v,x)=>{const s=step(v);return`<span class="c" data-tip="${d},${x}"${s?` style="background:var(${s})"`:''}></span>`}).join('')).join('');
  el.innerHTML=`<div class="heat" role="img" aria-label="Actions by weekday and hour">${rows}${h}</div><div class="scale"><span>Less</span>${steps.map(s=>`<i style="background:var(${s})"></i>`).join('')}<span>More</span><span style="margin-left:auto">${max?'Busiest: <b style="color:var(--ink2)">'+long[best[0]]+' '+String(best[1]).padStart(2,'0')+':00</b>':'No activity yet'}</span></div>`;
  bindTips(el,t=>{const[d,x]=t.dataset.tip.split(',').map(Number);return`<div class="t">${long[d]} · ${String(x).padStart(2,'0')}:00–${String(x+1).padStart(2,'0')}:00</div><b>${fmt(heat[d][x])}</b> action${heat[d][x]===1?'':'s'}`})}
function catStack(cats,total){if(!total)return'<div class="stack empty"></div>';return`<div class="stack">${ALL_CATS.filter(c=>cats[c]).map(c=>`<i data-tip="${c}" style="width:${(cats[c]/total*100).toFixed(2)}%;background:${col(c)}"></i>`).join('')}</div>`}
const delta=(a,b)=>{if(!b&&!a)return'no change';if(!b)return'<b>new</b> this period';const p=Math.round((a-b)/b*100);return`<b>${p>0?'▲':p<0?'▼':'■'} ${Math.abs(p)}%</b> vs previous`};
function stackTips(root){bindTips(root,t=>{const row=t.closest('[data-row]');if(!row)return'';const p=st.stats.people.find(x=>x.id==row.dataset.row),c=t.dataset.tip;return p?`<div class="t">${esc(p.name)}</div><div class="r"><span><i class="dot" style="background:${col(c)}"></i>${CATS[c]}</span><b>${fmt(p.cats[c])}</b></div>`:''})}

  const val=c=>k==='name'?c.name.toLowerCase():k==='updated_at'?String(c.updated_at||''):c[k];
  const top=S.clients.filter(c=>!c.parent||!byId[c.parent]).sort((a,b)=>(val(a)>val(b)?1:val(a)<val(b)?-1:0)*dir);
  const rows=[];top.forEach(c=>{rows.push(c);S.clients.filter(x=>x.parent===c.id).forEach(x=>rows.push(x))});
  const th=(key,l,n)=>`<th class="sort ${n?'n':''}" data-sort="${key}" aria-sort="${k===key?(dir>0?'ascending':'descending'):'none'}">${l}${k===key?(dir>0?' ↑':' ↓'):''}</th>`;
  const tot=S.clients.reduce((a,c)=>a+c.events,0);
  v.innerHTML=`<div class="fade"><div class="stat-row" style="margin-bottom:16px">${[['Clients',S.platform.clients,S.platform.subbrands+' sub-brands'],['Actions on clients',tot,'last '+perLabel()],['Files in Zoho',S.storage.files,mb(S.storage.bytes)],['Deleted, restorable',S.platform.deleted_clients,'see Zoho & system']].map(x=>`<div><b class="num">${fmt(x[1])}</b><span>${x[0]} · ${x[2]}</span></div>`).join('')}</div>
  <div class="card scroll"><table class="tbl"><thead><tr>${th('name','Client')}<th>Colours</th>${th('logos','Logos',1)}${th('fonts','Fonts',1)}${th('elements','Elements',1)}<th class="n">Book</th>${th('files','In Zoho',1)}${th('views','Views',1)}${th('downloads','Downloads',1)}${th('changes','Changes',1)}${th('updated_at','Last change')}</tr></thead>
  <tbody>${rows.map(c=>`<tr class="click" data-fc="${esc(c.name)}" title="See all activity for ${esc(c.name)}"><td><span class="cname ${c.parent&&byId[c.parent]?'sub':''}"><b style="font-weight:600">${esc(c.name)}</b></span></td><td><span class="sw">${c.swatch.filter(h=>/^#[0-9a-f]{3,8}$/i.test(h)).map(h=>`<i style="background:${h}" title="${esc(h)}"></i>`).join('')||'<span class="mute">–</span>'}</span></td><td class="n">${fmt(c.logos)}</td><td class="n">${fmt(c.fonts)}</td><td class="n">${fmt(c.elements)}</td><td class="n">${c.book?'✓':'<span class="mute">–</span>'}</td><td class="n" style="white-space:nowrap">${c.files?fmt(c.files)+' <span class="mute">· '+mb(c.bytes)+'</span>':'<span class="mute">–</span>'}</td><td class="n">${fmt(c.views)}</td><td class="n">${fmt(c.downloads)}</td><td class="n">${fmt(c.changes)}</td><td><span style="white-space:nowrap">${c.updated_at?esc(ago(String(c.updated_at))):'–'}</span>${c.updated_by?`<br><span class="mute" style="font-size:11.5px">by ${esc(c.updated_by)}</span>`:''}</td></tr>`).join('')||'<tr><td colspan="11" class="empty">No clients on the server yet.</td></tr>'}</tbody></table></div></div>`;
  $$('[data-sort]',v).forEach(h=>h.onclick=()=>{const kk=h.dataset.sort;st.sort=st.sort.k===kk?{k:kk,d:-st.sort.d}:{k:kk,d:kk==='name'?1:-1};viewClients(v)});
  wire(v);onResize=null}

/* ======================= system ======================= */
function viewSystem(v){
  const sto=st.stats.storage,M={none:'As uploaded (logos, fonts, sources)',image:'Image compressed','pdf-ghostscript':'PDF compressed (Ghostscript)'};
  v.innerHTML=`<div class="fade"><div class="grid g2">
   <div class="card"><header><div><h3>Zoho connection</h3><p>Checks the database, the Zoho sign-in, the LatchHub folder and what this server can compress.</p></div><button class="btn pri" id="hc">Run health check</button></header><div id="hr" class="mute">Not checked yet.</div></div>
   <div class="card"><header><div><h3>Upload test</h3><p>Really creates a small file in Zoho, reads it back and compares.</p></div><button class="btn" id="stt">Run upload test</button></header><div id="sr" class="mute">Not run yet.</div></div></div>
  <div class="sp"></div>
  <div class="card"><header><div><h3>Storage in Zoho</h3><p>Files LatchHub uploaded, and how much compression saved.</p></div></header>
   <div class="stat-row" style="margin-bottom:14px">${[['Files',fmt(sto.files)],['Stored',mb(sto.bytes)],['Before compression',mb(sto.orig_bytes)],['Saved',sto.orig_bytes?Math.max(0,Math.round((1-sto.bytes/sto.orig_bytes)*100))+'%':'–']].map(x=>`<div><b class="num">${x[1]}</b><span>${x[0]}</span></div>`).join('')}</div>
   ${sto.by_method.length?`<div class="scroll"><table class="tbl"><thead><tr><th>How it was stored</th><th class="n">Files</th><th class="n">Stored</th><th class="n">Original</th></tr></thead><tbody>${sto.by_method.map(m=>`<tr><td>${esc(M[m.method]||m.method)}</td><td class="n">${fmt(m.files)}</td><td class="n">${mb(m.bytes)}</td><td class="n">${mb(m.orig_bytes)}</td></tr>`).join('')}</tbody></table></div>`:''}</div>
  <div class="sp"></div>
  <div class="grid g2">
   <div class="card"><header><div><h3>Zoho clean-up queue</h3><p>Files or folders LatchHub tried to move to the WorkDrive trash but Zoho did not accept yet. Empty means everything was cleaned up.</p></div><button class="btn ghost" id="pr">Retry now</button></header><div id="pq"><div class="skel"></div></div></div>
   <div class="card"><header><div><h3>Deleted clients</h3><p>Restore brings back the client and its Zoho folder, while WorkDrive still keeps it in the trash.</p></div></header><div id="dc"><div class="skel"></div></div></div></div></div>`;
  $('#hc').onclick=health;$('#stt').onclick=selftest;
  $('#pr').onclick=async()=>{try{const r=await api('brands.php',{action:'retry_pending'});toast(r.done+' moved to the trash, '+r.failed+' still refused');pending()}catch(e){toast(e.message,6000)}};
  pending();deleted();onResize=null}
const checkTable=(rows,k)=>`<table class="tbl checks">${rows.map(c=>`<tr><td class="${c.ok?'ok':'bad'}">${c.ok?'✓':'✕'}</td><td>${esc(c[k])}${c.note?`<br><span class="mute" style="font-size:11.5px">${esc(c.note)}</span>`:''}</td></tr>`).join('')}</table>`;
async function health(){const r=$('#hr');r.innerHTML='<div class="skel"></div><div class="skel"></div>';try{const j=await api('health.php');r.innerHTML=`<p class="${j.all_ok?'ok':'bad'}" style="font-weight:600;margin-bottom:8px">${j.all_ok?'✓ Everything required is working.':'✕ Something needs attention.'} <span class="mute" style="font-weight:400">PHP ${esc(j.php)}</span></p>`+checkTable(j.checks,'check')}catch(e){r.innerHTML=`<span class="bad">${esc(e.message)}</span>`}}
async function selftest(){const r=$('#sr');r.innerHTML='<span class="mute">Creating a folder, uploading, downloading…</span>';try{const j=await api('selftest.php',{});r.innerHTML=`<p class="${j.all_ok?'ok':'bad'}" style="font-weight:600;margin-bottom:8px">${j.all_ok?'✓ Uploading and downloading work.':'✕ A step failed – details below.'}</p>`+checkTable(j.steps,'step')}catch(e){r.innerHTML=`<span class="bad">${esc(e.message)}</span>`}}
async function pending(){const el=$('#pq');if(!el)return;try{const j=await api('brands.php?pending=1');el.innerHTML=j.pending.length?`<table class="tbl">${j.pending.map(p=>`<tr><td><b>${esc(p.kind)}</b> <span class="mute">${esc(p.zoho_id)}</span><br><span class="mute" style="font-size:11.5px">${esc(dLocal(p.created_at))} · tried ${+p.tries} time(s)</span></td><td class="bad" style="font-size:12px">${esc(p.reason)}</td></tr>`).join('')}</table>`:'<span class="ok">✓ Nothing waiting.</span>'}catch(e){el.innerHTML=`<span class="bad">${esc(e.message)}</span>`}}
async function deleted(){const el=$('#dc');if(!el)return;try{const j=await api('brands.php?deleted=1');el.innerHTML=j.deleted.length?`<table class="tbl">${j.deleted.map(d=>`<tr><td><b>${esc(d.name)}</b><br><span class="mute" style="font-size:11.5px">deleted ${esc(dLocal(d.deleted_at))}${d.by_name?' by '+esc(d.by_name):''}</span></td><td class="n"><button class="btn sm" data-rs="${esc(d.id)}">Restore</button></td></tr>`).join('')}</table>`:'<span class="mute">None.</span>';
  $$('[data-rs]',el).forEach(b=>b.onclick=async()=>{if(!confirm('Restore this client and its Zoho folder?'))return;b.disabled=true;try{await api('brands.php',{action:'restore',id:b.dataset.rs});toast('Restored – designers will see it again within a minute');load()}catch(e){toast(e.message,7000);b.disabled=false}})}catch(e){el.innerHTML=`<span class="bad">${esc(e.message)}</span>`}}

/* keep the overview fresh while it is open */
setInterval(()=>{if(me&&me.role==='admin'&&!document.hidden&&st.view==='overview'&&!document.querySelector('.dlg,.drawer'))load()},120000);
boot();
</script></body></html>
