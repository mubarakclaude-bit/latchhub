<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LatchHub</title>
<link rel="icon" type="image/svg+xml" href="assets/latchhub/favicon.svg">
<meta name="color-scheme" content="light dark">
<style>
:root{--bg:#fbfbfa;--panel:#fff;--ink:#0b0b0b;--mute:#717171;--line:#e8e8e6;--line2:#d4d4d1;--accent:var(--brand,#2f5bea);--pass:#15803d;--warn:#a16207;--fail:#b91c1c;--pass-bg:#e7f6ec;--warn-bg:#fbf1d9;--fail-bg:#fbe9e9;--chk1:#fff;--chk2:#ececec}
:root[data-theme=dark]{--bg:#0a0a0a;--panel:#111;--ink:#f3f3f2;--mute:#8c8c8a;--line:#222;--line2:#363636;--pass:#4ade80;--warn:#facc15;--fail:#f87171;--pass-bg:#0f2a19;--warn-bg:#2b2410;--fail-bg:#2f1414;--chk1:#222;--chk2:#2c2c2c}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme]){--bg:#0a0a0a;--panel:#111;--ink:#f3f3f2;--mute:#8c8c8a;--line:#222;--line2:#363636;--pass:#4ade80;--warn:#facc15;--fail:#f87171;--pass-bg:#0f2a19;--warn-bg:#2b2410;--fail-bg:#2f1414;--chk1:#222;--chk2:#2c2c2c}}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;letter-spacing:-.006em;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
code,.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace}
#app{display:grid;grid-template-columns:252px 1fr;min-height:100vh}
aside{position:sticky;top:0;height:100vh;overflow:auto;padding:22px 12px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.logo{display:flex;align-items:center;gap:9px;font-weight:650;font-size:14px;margin:0 8px 14px;letter-spacing:-.01em}.logo b{width:16px;height:16px;border-radius:4px;background:var(--ink);display:inline-block}
.sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--mute);margin:20px 8px 6px;font-weight:600}
.nav{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:8px;border:0;background:none;cursor:pointer;width:100%;text-align:left;position:relative;transition:background .12s}
.nav:hover{background:var(--panel)}.nav.on{background:var(--panel);box-shadow:inset 0 0 0 1px var(--line)}
.nav.on:before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:2px;background:var(--ink);border-radius:2px}
.nav .th{width:28px;height:28px;border-radius:6px;background:#fff;flex:none;display:flex;align-items:center;justify-content:center;overflow:hidden;font-weight:700;color:#fff;border:1px solid var(--line)}
.nav .th img{width:100%;height:100%;object-fit:contain;padding:3px}
.nav .nm{display:block;font-weight:550;font-size:13.5px;line-height:1.2}.nav .dots{display:flex;gap:2px;margin-top:4px}.nav .dots i{width:9px;height:3px;border-radius:1px}
.nav .cnt{margin-left:auto;font-size:11px;color:var(--mute);border:1px solid var(--line2);border-radius:5px;padding:0 6px}
.tree{margin:1px 0 6px 21px;border-left:1px solid var(--line2)}
.nav.child{padding:5px 8px 5px 16px;border-radius:0 8px 8px 0;position:relative}.nav.child:after{content:"";position:absolute;left:0;top:50%;width:10px;border-top:1px solid var(--line2)}
.nav.child .th{width:22px;height:22px;border-radius:5px}.nav.child .nm{font-size:13px;font-weight:500}.nav.child .dots{display:none}.nav.child.on:before{left:-1px;top:6px;bottom:6px}
.sp{flex:1}
main{padding:28px 40px 90px;max-width:1220px;width:100%}
main.enter>*{animation:fade .35s both}@keyframes fade{from{opacity:0}to{opacity:1}}
.hero{border-radius:12px;padding:40px;min-height:250px;display:flex;justify-content:space-between;align-items:flex-end;gap:28px;flex-wrap:wrap}
.hero .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.14em;opacity:.7;margin-bottom:12px;font-weight:600}
.hero h1{margin:0;font-size:clamp(34px,5vw,56px);line-height:1;letter-spacing:-.045em;font-weight:700}
.hero p{margin:12px 0 0;max-width:520px;opacity:.85;font-size:15px}
.stats{display:flex;gap:6px;flex-wrap:wrap;margin-top:20px}.stats span{padding:2px 9px;border-radius:5px;border:1px solid currentColor;font-size:12px;opacity:.8}
.hero .row{margin-top:20px}
.hlogo{background:#fff;border-radius:10px;width:min(300px,100%);height:170px;display:flex;align-items:center;justify-content:center;padding:20px}.hlogo img{max-width:100%;max-height:130px;object-fit:contain}
.hero .btn{background:transparent;border-color:currentColor;color:inherit}.hero .btn.pri{background:#fff;color:#0b0b0b;border-color:#fff}
.pills{position:sticky;top:0;z-index:5;display:flex;gap:24px;margin:18px 0 0;background:var(--bg);border-bottom:1px solid var(--line);overflow:auto}
.pill{padding:13px 0;border:0;border-bottom:2px solid transparent;background:none;color:var(--mute);cursor:pointer;font-weight:550;white-space:nowrap;margin-bottom:-1px;transition:color .12s}.pill:hover{color:var(--ink);border-color:var(--ink)}
.btn{padding:6px 12px;border:1px solid var(--line2);background:var(--panel);border-radius:8px;cursor:pointer;font-weight:500;transition:border-color .12s,background .12s}
.btn:hover{border-color:var(--ink)}.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.sm{padding:3px 9px;font-size:12px;border-radius:6px}.btn.del{color:var(--fail)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
section{margin:46px 0 0;scroll-margin-top:60px}
.sh{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:16px;flex-wrap:wrap}.sh h3{margin:0;font-size:20px;letter-spacing:-.025em;font-weight:650}
.hint{display:block;font-weight:400;font-size:13px;color:var(--mute);margin-top:2px;letter-spacing:0}
.grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--mute);margin:24px 0 10px;font-weight:600}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:10px}.cgrid.big{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.cs{position:relative;width:100%;height:104px;border:1px solid rgba(128,128,128,.25);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;text-align:left;cursor:pointer;background:var(--c);overflow:hidden;transition:outline-color .12s}
.cs.big{height:176px}.cs:hover{outline:2px solid var(--ink);outline-offset:2px}.cs:active{transform:scale(.99)}
.cs .cn{font-weight:550;font-size:13px}.cs .chx{font:600 15px ui-monospace,"SF Mono",Menlo,monospace;letter-spacing:.2px}.cs.big .chx{font-size:21px}
.cs .cta{position:absolute;top:10px;right:12px;font-size:10.5px;opacity:0;padding:1px 7px;border-radius:5px;border:1px solid currentColor;transition:opacity .12s}.cs:hover .cta{opacity:.85}
.cs .ok{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:650;font-size:14px;background:var(--c);opacity:0;pointer-events:none}
.cs.copied .ok{animation:pop .9s ease both}@keyframes pop{0%{opacity:0}12%{opacity:1}80%{opacity:1}100%{opacity:0}}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:10px}
.lt,.it,.gt,.ft{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.sq{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;background:#fff;padding:14px;border-bottom:1px solid var(--line)}.sq img{max-width:100%;max-height:100%;object-fit:contain}
.lbg-dark .sq{background:#141414}.lbg-check .sq{background:repeating-conic-gradient(#e6e6e6 0 25%,#fff 0 50%) 0 0/16px 16px}
.lc{display:flex;justify-content:space-between;gap:8px;padding:10px 12px 8px;font-size:13px;align-items:flex-start}.lc .muted{flex:none;font:11px ui-monospace,Menlo,monospace}
.file{display:flex;align-items:center;justify-content:center;height:150px;background:var(--bg);color:var(--mute);font-weight:700;font-size:18px}
.fmts{display:flex;flex-wrap:wrap;gap:5px;padding:0 12px 12px}
.fchip{font:600 10.5px ui-monospace,Menlo,monospace;padding:3px 8px;border-radius:5px;border:1px solid var(--line2);text-decoration:none;color:var(--ink);background:none;transition:.12s}.fchip:hover{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}.seg button{border:0;background:none;padding:4px 12px;cursor:pointer;font-size:12.5px}.seg button.on{background:var(--ink);color:var(--bg)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
.fontprev{font-size:72px;line-height:1;padding:22px 22px 6px;letter-spacing:-.04em}.fi{padding:4px 22px 20px;display:flex;flex-direction:column}
.rules{display:grid;gap:6px}.rule{display:flex;gap:12px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.rule i{flex:none;width:18px;height:18px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:11px;font-weight:700;margin-top:2px}
.rule.yes i{background:var(--pass-bg);color:var(--pass)}.rule.no i{background:var(--fail-bg);color:var(--fail)}
.form{background:var(--panel);border:1px dashed var(--line2);border-radius:10px;padding:12px;margin-bottom:16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=text],input[type=number],select,textarea{padding:7px 10px;border:1px solid var(--line2);border-radius:8px;background:var(--panel)}
input[type=text]:focus,input[type=number]:focus,select:focus,textarea:focus{outline:2px solid var(--ink);outline-offset:-1px}
input[type=color]{width:38px;height:32px;padding:0;border:1px solid var(--line2);border-radius:8px;background:none}
textarea{width:100%;min-height:120px}
.none,.empty{color:var(--mute);padding:26px;text-align:center;border:1px dashed var(--line2);border-radius:10px}
.empty{padding:90px 20px;border:0}.empty h2{color:var(--ink)}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:6px}
h2{margin:0;font-size:28px;letter-spacing:-.04em}h3{margin:0 0 10px;font-size:15px}.sub{color:var(--mute);margin:4px 0 18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}.pad{padding:14px 18px}
.drop{border:1.5px dashed var(--line2);border-radius:12px;padding:48px 30px;text-align:center;color:var(--mute);background:var(--panel);cursor:pointer;transition:.12s}.drop:hover,.drop.over{border-color:var(--ink);color:var(--ink)}
.res{display:grid;grid-template-columns:minmax(260px,44%) 1fr;margin-top:14px;height:calc(100vh - 150px);min-height:480px;max-height:900px}
.res .pv{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);background:var(--bg)}
.res .stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:14px;overflow:hidden}

.res img.th{display:block;max-width:100%;max-height:calc(100vh - 340px);min-height:80px;width:auto;height:auto;background:repeating-conic-gradient(var(--chk1) 0 25%,var(--chk2) 0 50%) 0 0/16px 16px}
.ovwrap,.ov,.ovmask{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.pulse{animation:lpulse 1.1s ease-in-out infinite}@keyframes lpulse{50%{opacity:.25}}
.res .cap{padding:10px 14px;border-top:1px solid var(--line);font-size:12.5px;line-height:1.45;min-height:64px;max-height:130px;overflow:auto}
.res .an{overflow-y:auto;min-height:0;padding:14px 18px}
li.it{padding:8px 10px;margin:0 -10px;border-radius:8px;border:1px solid transparent}li.it.clk{cursor:pointer}li.it.clk:hover{background:var(--panel);border-color:var(--line2)}li.it.sel{background:var(--panel);border-color:var(--ink)}
li.it .where{color:var(--mute);font-size:11.5px;opacity:0;transition:.12s}li.it:hover .where,li.it.sel .where{opacity:1}li.it .ref{color:var(--mute);font-size:11.5px;font-style:italic}
.kb{margin-top:22px;border:1px solid var(--line);border-radius:10px;padding:12px 16px;background:var(--panel)}.kbl{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;margin-top:6px}.kbl>div{font-size:12.5px;line-height:1.4}.kbl small{display:block;color:var(--mute);font-style:italic}.kbl span{display:block}
@media(max-width:860px){.res{grid-template-columns:1fr;grid-template-rows:minmax(0,46%) minmax(0,1fr);height:calc(100vh - 90px)}.res .pv{border-right:0;border-bottom:1px solid var(--line)}.res img.th{max-height:calc(46vh - 150px)}.res .cap{max-height:80px;min-height:0}}
.badge{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:5px;letter-spacing:.06em}
.b-tip{background:rgba(99,102,241,.14);color:#8b8ff5}.b-pass{background:var(--pass-bg);color:var(--pass)}.b-warn{background:var(--warn-bg);color:var(--warn)}.b-fail{background:var(--fail-bg);color:var(--fail)}.b-info{background:transparent;color:var(--mute);border:1px solid var(--line2)}
.chk{list-style:none;margin:10px 0;padding:0;display:grid;gap:9px}.chk li{display:flex;gap:10px;align-items:flex-start}.chk .badge{flex:none;margin-top:1px;min-width:54px;text-align:center}.chk small{display:block;color:var(--mute);font-size:12.5px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.chip{display:flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:6px;padding:2px 8px 2px 3px;font-size:12px}.chip i{width:16px;height:16px;border-radius:4px;border:1px solid rgba(128,128,128,.4)}
.muted{color:var(--mute)}.lock{font-size:12px;color:var(--mute)}label.chkl{display:flex;gap:8px;align-items:center}
.field{display:grid;gap:4px;margin-bottom:14px;max-width:560px}.field small{color:var(--mute)}

details summary{cursor:pointer}
.lsec{margin:22px 0 2px;padding-top:14px;border-top:1px solid var(--line);font-weight:650;font-size:14px}.lsec span{font-weight:400;font-size:12px;color:var(--mute);margin-left:6px}
.lcat{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--mute);margin:16px 0 4px;font-weight:600}.chk .fix{color:var(--ink);opacity:.85;margin-top:2px}
.score{font-size:22px;font-weight:700;letter-spacing:-.03em}.score small{font-size:11px;font-weight:500;color:var(--mute)}.score.s-pass{color:var(--pass)}.score.s-warn{color:var(--warn)}.score.s-fail{color:var(--fail)}
.legend{display:flex;flex-wrap:wrap;gap:10px;padding:8px 10px;font-size:11px;color:var(--mute)}.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}
.lkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}.lkw{position:relative}.lk{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);text-decoration:none;color:inherit;transition:border-color .12s}.lk:hover{border-color:var(--ink)}
.lk-ico{width:36px;height:36px;border-radius:8px;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;font-size:15px;flex:none}.lk b{display:block;font-weight:600;line-height:1.25}.lk small{color:var(--mute);font-size:12px}.lk .go{margin-left:auto;color:var(--mute)}.lkw .del{position:absolute;top:6px;right:6px}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.kid{display:flex;align-items:center;gap:14px;text-align:left;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);cursor:pointer;width:100%;min-height:84px;transition:border-color .12s}.kid:hover{border-color:var(--ink)}
.kth{width:56px;height:56px;border-radius:8px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none}.kth img{max-width:100%;max-height:100%;padding:5px;object-fit:contain}

#modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.5);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:32px 16px}
#modal .mp{background:var(--bg);border:1px solid var(--line2);border-radius:12px;width:min(760px,100%)}

#modal .mb{padding:10px 24px 24px}#modal .fs{margin:18px 0 6px;font-weight:650}.fmt{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin:8px 0 4px}.fmt div{border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:12.5px;color:var(--mute);background:var(--panel)}.fmt b{color:var(--ink);display:block;margin-bottom:2px}
#modal input[type=text],#modal select,#modal textarea{width:100%}#modal textarea{min-height:92px;font:13px ui-monospace,Menlo,monospace}.mrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mlogo{display:grid;grid-template-columns:52px 1fr 150px 30px;gap:8px;align-items:center;margin-top:8px}.mlogo .t{width:52px;height:40px;border-radius:6px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:11px;font-weight:700;color:#555}.mlogo .t img{max-width:100%;max-height:100%}
.mf{display:flex;justify-content:flex-end;gap:8px;padding-top:20px}
.smart{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--panel)}.frow{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:13px}.frow .fn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.frow select{width:130px!important}.fs2{font-size:12px}
.mlogo2{display:grid;grid-template-columns:64px 1fr 150px 30px;gap:10px;align-items:center;margin-top:8px}.mlogo2 .t{width:64px;height:64px;border-radius:8px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden}.mlogo2 .t img{max-width:100%;max-height:100%}.mlogo2 .lcol{display:flex;flex-direction:column;gap:4px}
.ggrid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}.gchk{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--panel)}.gsw2{width:64px;height:40px;border-radius:5px;flex:none}

.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}.isq{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;padding:26px}.isq img{max-width:100%;max-height:100%}

<script>
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const tick=()=>new Promise(r=>setTimeout(r,0));
function toast(m,ms){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),ms||1400)}
function copy(txt){(navigator.clipboard?.writeText(txt)||Promise.reject()).catch(()=>{const a=document.createElement('textarea');a.value=txt;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()});toast('Copied '+(txt.length>34?txt.slice(0,32)+'…':txt))}
const normHex=h=>{h=String(h).trim().replace('#','');if(h.length===3)h=[...h].map(c=>c+c).join('');return /^[0-9a-fA-F]{6}$/.test(h)?'#'+h.toUpperCase():null};
const hexToRgb=h=>{h=normHex(h);return [1,3,5].map(i=>parseInt(h.slice(i,i+2),16))};
const rgbToHex=(r,g,b)=>'#'+[r,g,b].map(v=>Math.round(v).toString(16).padStart(2,'0')).join('').toUpperCase();
function cmyk([r,g,b]){const k=1-Math.max(r,g,b)/255;if(k>=1)return[0,0,0,100];return[(1-r/255-k)/(1-k),(1-g/255-k)/(1-k),(1-b/255-k)/(1-k),k].map(v=>Math.round(v*100))}

/* ---------- storage (IndexedDB) ---------- */
const DEMO=/[?&]demo\b/.test(location.search);
const DB={open(){return this.p||(this.p=new Promise((res,rej)=>{const q=indexedDB.open(DEMO?'brandhub-demo':'brandhub',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)}))},
async get(k){const d=await this.open();return new Promise(r=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})},
async set(k,v){const d=await this.open();return new Promise(r=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>r()})}};
let S={brands:[]};
let saveT;const save=()=>{clearTimeout(saveT);saveT=setTimeout(()=>{DB.set('state',S).catch(()=>toast('Could not save'));if(typeof LHsync!=='undefined'&&LHsync.on)LHsync.onSave()},150)};

/* ---------- colour science ---------- */
function rgb2lab(r,g,b){const f=v=>{v/=255;return v>.04045?Math.pow((v+.055)/1.055,2.4):v/12.92};const R=f(r),G=f(g),B=f(b);

function dE(l1,l2){const[L1,a1,b1]=l1,[L2,a2,b2]=l2,rad=Math.PI/180,p7=Math.pow(25,7);

const h1=C1p===0?0:hh(b1,a1p),h2=C2p===0?0:hh(b2,a2p),dL=L2-L1,dC=C2p-C1p;let dh=0;
if(C1p*C2p!==0){dh=h2-h1;if(dh>180)dh-=360;else if(dh<-180)dh+=360}
const dH=2*Math.sqrt(C1p*C2p)*Math.sin(dh*rad/2),Lb=(L1+L2)/2,Cbp=(C1p+C2p)/2;let hb=h1+h2;
if(C1p*C2p!==0){hb=Math.abs(h1-h2)<=180?(h1+h2)/2:(h1+h2<360?(h1+h2+360)/2:(h1+h2-360)/2)}

const labOfHex=h=>rgb2lab(...hexToRgb(h));
const isNeutral=lab=>Math.hypot(lab[1],lab[2])<10;

/* ---------- Adobe Swatch Exchange (.ase) ---------- */
function makeASE(colors){const u16=n=>[n>>8&255,n&255],u32=n=>[n>>>24&255,n>>>16&255,n>>>8&255,n&255];
const f32=x=>{const d=new DataView(new ArrayBuffer(4));d.setFloat32(0,x,false);return[...new Uint8Array(d.buffer)]};
const b=[0x41,0x53,0x45,0x46,...u16(1),...u16(0),...u32(colors.length)];
colors.forEach(c=>{const n=c.name,nu=[];for(let i=0;i<n.length;i++)nu.push(...u16(n.charCodeAt(i)));nu.push(0,0);
const[r,g,bl]=hexToRgb(c.hex);const body=[...u16(n.length+1),...nu,0x52,0x47,0x42,0x20,...f32(r/255),...f32(g/255),...f32(bl/255),...u16(2)];
b.push(...u16(1),...u32(body.length),...body)});return new Uint8Array(b)}
function download(name,blobParts,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(blobParts,{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}

/* ---------- image loading ---------- */
const loadImg=src=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src});
const readFile=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)});
async function logoDims(file,dataUrl){
  if(file.type==='image/svg+xml'||/\.svg$/i.test(file.name)){const t=await file.text();const m=t.match(/viewBox\s*=\s*["']\s*[-\d.]+[ ,]+[-\d.]+[ ,]+([\d.]+)[ ,]+([\d.]+)/i);if(m)return{w:+m[1],h:+m[2]};
    const w=t.match(/<svg[^>]*\swidth\s*=\s*["']([\d.]+)/i),h=t.match(/<svg[^>]*\sheight\s*=\s*["']([\d.]+)/i);if(w&&h)return{w:+w[1],h:+h[1]}}
  try{const i=await loadImg(dataUrl);return{w:i.naturalWidth||300,h:i.naturalHeight||100}}catch{return{w:0,h:0}}}

/* ================= CHECKER ENGINE ================= */
const FEATURES={logo:false};
const LEVEL_RANK={info:0,tip:0,pass:1,warn:2,fail:3};
function analyzeColors(canvas,rules,palette){
  const W=256,sc=Math.min(1,W/Math.max(canvas.width,canvas.height)),w=Math.max(1,Math.round(canvas.width*sc)),h=Math.max(1,Math.round(canvas.height*sc));
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(canvas,0,0,w,h);
  const d=x.getImageData(0,0,w,h).data,map=new Map();let total=0;
  for(let i=0;i<d.length;i+=4){if(d[i+3]<200)continue;total++;const k=(d[i]>>3)<<10|(d[i+1]>>3)<<5|(d[i+2]>>3);let b=map.get(k);if(!b){b={n:0,r:0,g:0,b:0};map.set(k,b)}b.n++;b.r+=d[i];b.g+=d[i+1];b.b+=d[i+2]}
  const items=[];if(!total)return{items:[{level:'info',title:'Colour check skipped',detail:'Image is fully transparent.'}],clusters:[]};
  const bk=[...map.values()].filter(b=>b.n>=total*.0005).sort((a,b)=>b.n-a.n),cl=[];
  for(const b of bk){const m=[b.r/b.n,b.g/b.n,b.b/b.n],lab=rgb2lab(...m);let hit=null;for(const c of cl){if(dE(lab,c.lab)<6){hit=c;break}}
    if(hit){hit.n+=b.n;hit.r+=b.r;hit.g+=b.g;hit.b+=b.b}else cl.push({n:b.n,r:b.r,g:b.g,b:b.b,lab})}
  const clusters=cl.map(c=>{const rgb=[c.r/c.n,c.g/c.n,c.b/c.n];return{hex:rgbToHex(...rgb),lab:rgb2lab(...rgb),pct:c.n/total}}).filter(c=>c.pct>=.01).sort((a,b)=>b.pct-a.pct);
  const photo=clusters.slice(0,8).reduce((s,c)=>s+c.pct,0)<.55;
  const tol=+rules.tol||6,pal=palette.map(p=>({...p,lab:labOfHex(p.hex)})),forb=(rules.forbidden||'').split(/[\s,;]+/).map(normHex).filter(Boolean).map(h=>({hex:h,lab:labOfHex(h)}));
  const matched={};let near=[],off=[],bad=[];
  for(const c of clusters){
    const f=forb.find(f=>dE(c.lab,f.lab)<10);if(f){c.status='forbidden';c.note='forbidden '+f.hex;bad.push(c);continue}
    let best=null,bd=1e9;for(const p of pal){const v=dE(c.lab,p.lab);if(v<bd){bd=v;best=p}}
    c.de=bd;c.nearest=best;
    if(best&&bd<=tol){c.status='match';c.note=best.name;matched[best.hex]=(matched[best.hex]||0)+c.pct;continue}
    if(rules.neutrals!==false&&isNeutral(c.lab)){c.status='neutral';c.note='neutral';continue}
    if(photo){c.status='photo';c.note='photo/gradient';continue}
    if(best&&bd<=15){c.status='near';c.note='close to '+best.hex+' (ΔE '+bd.toFixed(1)+')';near.push(c)}
    else{c.status='off';c.note='not in palette';if(c.pct>=.02)off.push(c)}
  }
  if(!pal.length)items.push({level:'info',title:'No brand colours defined',detail:'Add colours in the Colors tab to enable this check.'});
  else{
    const chroma=pal.filter(p=>!isNeutral(p.lab));
    {const hit=pal.filter(p=>(matched[p.hex]||0)>=(photo?.005:.01));
      if(hit.length)items.push({level:'pass',title:'Brand colour present',detail:hit.map(p=>p.name+' '+p.hex+' ('+((matched[p.hex])*100).toFixed(1)+'%)').join(', ')});
      else items.push({level:'fail',title:'No brand colour detected',detail:'None of the brand\'s colours (ΔE ≤ '+tol+') cover at least '+(photo?'0.5':'1')+'% of the creative.'})}
    near.forEach(c=>items.push({level:c.pct>=.03?'fail':'warn',title:'Off-shade colour '+c.hex,detail:'Covers '+(c.pct*100).toFixed(1)+'% and is '+c.note+'. Likely the wrong shade of '+c.nearest.name+' — use '+c.nearest.hex+'.'}));
    bad.forEach(c=>items.push({level:'fail',title:'Forbidden colour '+c.hex,detail:'Covers '+(c.pct*100).toFixed(1)+'% — '+c.note+'.'}));
    off.forEach(c=>items.push({level:'warn',title:'Colour outside palette '+c.hex,detail:'Covers '+(c.pct*100).toFixed(1)+'%. Not in the brand palette — confirm it is intended (e.g. photo, client-approved accent).'}));
    if(photo)items.push({level:'info',title:'Photographic / gradient content',detail:'Many blended colours, so only brand-colour presence is judged; off-palette colours are not flagged.'});
    if(!near.length&&!bad.length&&!off.length&&items.every(i=>i.level!=='fail'))items.push({level:'pass',title:'No off-palette colours found',detail:''});
  }
  return{items,clusters:clusters.slice(0,12),photo};
}

/* --- logo presence: scale-space template matching on logo shape, then colour verification --- */
function renderTpl(img,lw,lh,tw,asp=1){
  const th=Math.max(2,Math.round(tw*lh/lw*asp)),pad=Math.max(2,Math.round(tw*.08)),W=tw+2*pad,H=th+2*pad;
  const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(img,pad,pad,tw,th);
  const d=x.getImageData(0,0,W,H).data,opaqueCorner=d[3]>250&&d[(W-1)*4+3]>250;
  const mask=new Uint8Array(W*H);let cnt=0,mr=0,mg=0,mb=0;
  for(let i=0;i<W*H;i++){const o=i*4;let m;
    if(opaqueCorner){m=(Math.abs(d[o]-d[0])+Math.abs(d[o+1]-d[1])+Math.abs(d[o+2]-d[2]))>90&&i>=0&&(Math.floor(i/W)>=pad&&Math.floor(i/W)<pad+th&&i%W>=pad&&i%W<pad+tw)}
    else m=d[o+3]>128;
    if(m){mask[i]=1;cnt++;mr+=d[o];mg+=d[o+1];mb+=d[o+2]}}
  if(cnt<6||cnt>W*H*.97)return null;
  const step=Math.max(1,Math.ceil(Math.sqrt(W*H/420))),xs=[],ys=[],ts=[];let sT=0;
  for(let y=0;y<H;y+=step)for(let xx=0;xx<W;xx+=step){xs.push(xx);ys.push(y);const t=mask[y*W+xx];ts.push(t);sT+=t}
  const n=xs.length;if(sT<3||sT>n-3)return null;
  return{W,H,pad,tw,th,xs:Int16Array.from(xs),ys:Int16Array.from(ys),ts:Uint8Array.from(ts),n,sT,mask,mean:[mr/cnt,mg/cnt,mb/cnt],cnt};
}
function matchTpl(g,GW,GH,t,stride,x0,x1,y0,y1){
  let best={s:0,x:0,y:0};const{xs,ys,ts,n,sT}=t,den0=n*sT-sT*sT;
  x0=Math.max(0,x0);y0=Math.max(0,y0);x1=Math.min(GW-t.W,x1);y1=Math.min(GH-t.H,y1);
  const I=matchTpl.ii,S1=I.s,S2=I.s2,P=GW+1,area=t.W*t.H;
  for(let y=y0;y<=y1;y+=stride)for(let x=x0;x<=x1;x+=stride){
    const a=y*P+x,b=a+t.W,c=(y+t.H)*P+x,d=c+t.W,m1=(S1[d]-S1[b]-S1[c]+S1[a])/area,v=(S2[d]-S2[b]-S2[c]+S2[a])/area-m1*m1;
    if(v<.0004)continue;
    let sI=0,sII=0,sIT=0;
    for(let k=0;k<n;k++){const v=g[(y+ys[k])*GW+x+xs[k]];sI+=v;sII+=v*v;if(ts[k])sIT+=v}
    const dn=den0*(n*sII-sI*sI);if(dn<=1e-9)continue;const s=Math.abs((n*sIT-sI*sT)/Math.sqrt(dn));if(s>best.s)best={s,x,y}}
  return best;
}
async function analyzeLogo(canvas,brand,imgs){
  const logos=brand.logos.filter(l=>l.check&&imgs[l.id]);
  if(!logos.length)return{level:'info',title:'Logo check skipped',detail:'Upload at least one PNG/SVG/JPG logo in the Logos tab so the checker has something to look for.'};
  const sc=Math.min(1,640/Math.max(canvas.width,canvas.height)),W=Math.max(8,Math.round(canvas.width*sc)),H=Math.max(8,Math.round(canvas.height*sc));
  const wc=document.createElement('canvas');wc.width=W;wc.height=H;const wx=wc.getContext('2d',{willReadFrequently:true});wx.fillStyle='#fff';wx.fillRect(0,0,W,H);wx.drawImage(canvas,0,0,W,H);
  const px=wx.getImageData(0,0,W,H).data,g=new Float32Array(W*H);for(let i=0;i<W*H;i++)g[i]=(.299*px[i*4]+.587*px[i*4+1]+.114*px[i*4+2])/255;
  const P=W+1,ii={s:new Float64Array(P*(H+1)),s2:new Float64Array(P*(H+1))};
  for(let y=0;y<H;y++){let rs=0,rs2=0;for(let x=0;x<W;x++){const v=g[y*W+x];rs+=v;rs2+=v*v;const i=(y+1)*P+x+1;ii.s[i]=ii.s[i-P]+rs;ii.s2[i]=ii.s2[i-P]+rs2}}
  matchTpl.ii=ii;
  const results=[];let bestS1=0;
  for(const L of logos){
    const img=imgs[L.id],lw=L.w||img.naturalWidth||300,lh=L.h||img.naturalHeight||100;let bests=[];
    for(let tw=12;tw<=W*.92;tw=Math.round(tw*1.25)+ (tw<20?1:0)){

    }

      const t0=renderTpl(img,lw,lh,b.tw);if(!t0)continue;
      for(const f of [1,.93,1.07,.86,1.14]){const tw=Math.round(b.tw*f),t=renderTpl(img,lw,lh,tw);if(!t||t.W>W||t.H>H)continue;
        const cx=b.x+t0.W/2-t.W/2,cy=b.y+t0.H/2-t.H/2,r=b.stride*2+2;
        const m=matchTpl(g,W,H,t,1,Math.round(cx-r),Math.round(cx+r),Math.round(cy-r),Math.round(cy+r));
        if(!fin||m.s>fin.s)fin={...m,tw,t,asp:1}}}
    if(!fin)continue;
    s1=fin.s;
    if(fin.tw>=36&&fin.s>=.5&&fin.s>=bestS1){bestS1=fin.s;const base=fin,r=Math.max(6,Math.round(base.tw*.3)),cx0=base.x+base.t.W/2,cy0=base.y+base.t.H/2;
     for(const asp of [.45,.55,.65,.75,.85,1.15,1.3,1.5,1.7,1.9])for(const f of [.76,.84,.92,1,1.1]){const tw=Math.round(base.tw*f),t=renderTpl(img,lw,lh,tw,asp);if(!t||t.W>W||t.H>H)continue;
       const m=matchTpl(g,W,H,t,Math.max(1,Math.round(r/6)),Math.round(cx0-t.W/2-r),Math.round(cx0-t.W/2+r),Math.round(cy0-t.H/2-r),Math.round(cy0-t.H/2+r));
       if(m.s>fin.s)fin={...m,tw,t,asp}}}
    const t=fin.t;let r=0,gg=0,b=0,c=0;
    for(let yy=0;yy<t.H;yy++)for(let xx=0;xx<t.W;xx++){if(!t.mask[yy*t.W+xx])continue;const o=((fin.y+yy)*W+fin.x+xx)*4;r+=px[o];gg+=px[o+1];b+=px[o+2];c++}
    const found=[r/c,gg/c,b/c],cd=dE(rgb2lab(...found),rgb2lab(...t.mean));

  }

  const rules=brand.rules;
  if(ok){

  }
  if(dist)return{level:'fail',title:'Logo looks stretched or squashed',detail:'"'+dist.L.name+'" fits best when its height is ~'+Math.round(dist.asp*100)+'% of the correct proportion. Always scale the logo proportionally (hold Shift).',box:dist.box,boxOk:false};
  const wrong=results.filter(r=>r.s>=.65).sort((a,b)=>b.s-a.s)[0];

  return{level:rules.requireLogo===false?'info':'fail',title:'Logo not found',detail:'No approved logo variant detected. It may be missing, stretched/distorted, heavily cropped, or have effects (shadow, outline) applied.'};
}

async function analyze(canvas,brand,label){
  const colors=analyzeColors(canvas,brand.rules,brand.colors);
  let logo={};if(FEATURES.logo){const imgs={};for(const l of brand.logos.filter(l=>l.check)){try{imgs[l.id]=await loadImg(l.data)}catch{}}logo=await analyzeLogo(canvas,brand,imgs)}
  const items=FEATURES.logo?[logo,...colors.items]:colors.items;
  const worst=items.reduce((m,i)=>LEVEL_RANK[i.level]>LEVEL_RANK[m]?i.level:m,'pass');
  const tw=Math.min(640,canvas.width),tf=tw/canvas.width,tc=document.createElement('canvas');tc.width=tw;tc.height=Math.round(canvas.height*tf);
  const x=tc.getContext('2d');x.drawImage(canvas,0,0,tc.width,tc.height);
  if(logo.box){x.lineWidth=3;x.strokeStyle=logo.boxOk?'#22c55e':'#f59e0b';x.strokeRect(logo.box.x*tf,logo.box.y*tf,logo.box.w*tf,logo.box.h*tf)}
  return{label,items,clusters:colors.clusters,level:worst==='info'?'pass':worst,thumb:tc.toDataURL('image/jpeg',.85),w:canvas.width,h:canvas.height};
}
async function fileToCanvases(file){
  const out=[];
  if(file.type.startsWith('video/')){
    const v=document.createElement('video');v.muted=true;v.preload='auto';v.playsInline=true;const url=URL.createObjectURL(file);v.src=url;
    await new Promise((res,rej)=>{v.onloadedmetadata=res;v.onerror=()=>rej(new Error('Cannot read video'))});
    const dur=v.duration||1,sc=Math.min(1,1280/Math.max(v.videoWidth,v.videoHeight));
    for(const p of [.04,.25,.5,.75,.96]){const t=dur*p;v.currentTime=t;await new Promise(r=>{v.onseeked=r});
      const c=document.createElement('canvas');c.width=Math.round(v.videoWidth*sc);c.height=Math.round(v.videoHeight*sc);c.getContext('2d').drawImage(v,0,0,c.width,c.height);out.push({c,label:file.name+' @ '+t.toFixed(1)+'s'})}
    URL.revokeObjectURL(url);return out}
  if(!file.type.startsWith('image/'))throw new Error('Unsupported file. Export your PSD / AI / Figma frame as PNG or JPG (or a video file) and upload that.');
  const url=URL.createObjectURL(file),img=await loadImg(url),sc=Math.min(1,2400/Math.max(img.naturalWidth,img.naturalHeight));
  const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*sc);c.height=Math.round(img.naturalHeight*sc);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
  return [{c,label:file.name}];
}

function resCard(r,ri){
  const lab={pass:'PASS',warn:'REVIEW',fail:'FAIL'}[r.level],cats=[...new Set(r.items.map(i=>i.cat||'Colour'))],head={'Brand fit':['Brand assessment','this creative compared with the client\'s colours, logos, fonts and written rules'],Logo:['Logo analysis','is it the right logo · edge spacing · clear space · logo colour'],Spacing:r.mode==='image'?['Text analysis','image-focused design: text spacing · text colour (other checks are skipped)']:['Content analysis','spacing · alignment · typography · composition (logo excluded)']};
  const firstC=cats.find(c=>['Spacing','Alignment','Typography','Composition'].includes(c));if(firstC&&firstC!=='Spacing'){head[firstC]=head.Spacing;delete head.Spacing}
  const li=(i,ii)=>{const loc=(i.hl&&i.hl.length)||i.hlColor,has=i.level==='fail'||i.level==='warn'||loc;
    return`<li class="it${has?' clk':''}${r.sel===ii?' sel':''}"${has?` data-ls="${ri}:${ii}" tabindex="0"`:''}><span class="badge b-${i.level}">${i.level.toUpperCase()}</span><div><b>${esc(i.title)}</b>${i.detail?`<small>${esc(i.detail)}</small>`:''}${i.fix?`<small class="fix">→ ${esc(i.fix)}</small>`:''}${i.ref?`<small class="ref">Basis: ${esc(i.ref)}</small>`:''}${has?`<small class="where">📍 ${loc?'Show where on the design':'Applies to the whole design'}</small>`:''}</div></li>`};
  const anyG=(r.marks||[]).length>0;
  return`<div class="card res"><div class="pv"><div class="stage"><div class="sbox"><img class="th" src="${r.thumb}" alt=""><div class="ovwrap">${lensOverlayHTML(r)}</div></div></div>
  <div class="legend">${anyG?`<label class="chkl"><input type="checkbox" data-lg="${ri}" ${r.guides?'checked':''}> Show measurement guides</label>`:''}<span><i style="background:#ff3b6b"></i>selected issue</span><span><i style="background:#22c55e"></i>logo / OK</span></div>
  <div class="cap">${lensCapHTML(r)}</div></div>
  <div class="an"><div class="row" style="justify-content:space-between"><b>${esc(r.label)}</b><span class="row"><span class="score s-${r.level}">${r.score??''}${r.score!=null?'<small>/100</small>':''}</span><span class="badge b-${r.level}">${lab}</span></span></div>
  <div class="muted" style="font-size:12px">${r.w}×${r.h}px${r.fmt?' · '+esc(r.fmt):''}${r.style?' · '+esc(r.style):''}</div>
  ${cats.map(cat=>`${head[cat]?`<div class="lsec">${head[cat][0]} <span>${head[cat][1]}</span></div>`:''}<div class="lcat">${esc(cat)}</div><ul class="chk">${r.items.map((i,ii)=>[i,ii]).filter(([i])=>(i.cat||'Colour')===cat).map(([i,ii])=>li(i,ii)).join('')}</ul>`).join('')}
  <div class="lcat">Dominant colours</div><div class="chips">${r.clusters.map(c=>`<span class="chip" title="${esc(c.note||'')}"><i style="background:${c.hex}"></i>${c.hex} · ${(c.pct*100).toFixed(0)}% · ${esc(c.status==='match'?'✓ '+c.note:c.status==='tint'?'◐ '+c.note:c.status==='shade'?'✕ '+c.note:(c.note||c.status||''))}</span>`).join('')}</div></div></div>`}

async function runCheck(files){
  const b=S.brands.find(x=>x.id===ui.check.brandId);if(!b)return;
  for(const f of files){
    try{ui.check.busy='Analysing '+f.name+'…';render();await tick();
      const cs=await fileToCanvases(f);
      for(const {c,label} of cs){const r=await lensAnalyze(c,b,label);ui.check.results.unshift(r)}
    }catch(e){ui.check.results.unshift({label:f.name,level:'warn',items:[{cat:'Colour',level:'warn',title:'Could not read file',detail:e.message}],clusters:[],thumb:'',w:0,h:0})}
  }
  ui.check.busy='';render();
}

document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-a]');if(!t){if(e.target.closest('#drop')===null)return}
  if(!t)return;const a=t.dataset.a,id=t.dataset.id,b=brand();
  if(EDIT_ACTIONS.has(a)&&b)b.edited=true;
  if(a==='home'){ui.view='home';ui.anim=true}
  else if(a==='theme'){THEME.set(id);render();return}
  else if(a==='newIcon'){openIconGen(b.id);return}
  else if(a==='addLink'){openLinkForm(b.id);return}
  else if(a==='delLink'){b.links=(b.links||[]).filter(x=>x.id!==id)}
  else if(a==='bookblob'){const f=await DB.get(b.book.blobKey);if(!f){toast('Brand book file not found in this browser');return}const u=URL.createObjectURL(f),el=document.createElement('a');el.href=u;el.download=b.book.filename;el.click();setTimeout(()=>URL.revokeObjectURL(u),4000);return}
  else if(a==='delEl'){b.elements=(b.elements||[]).filter(x=>x.id!==id)}

  else if(a==='goto'){document.getElementById(id)?.scrollIntoView({behavior:'smooth'});return}
  else if(a==='tab'){ui.tab=id}
  else if(a==='openCheck'){ui.anim=true;ui.view='check';ui.check.brandId=ui.check.brandId||ui.brandId}
  else if(a==='checkThis'){ui.anim=true;ui.view='check';ui.check.brandId=b.id}

  else if(a==='demo'){ui.anim=true;loadDemo();return}
  else if(a==='addBrand'){const n=prompt('Client name?');if(!n)return;const nb=newBrand(n.trim());S.brands.push(nb);ui.brandId=nb.id;ui.view='brand'}
  else if(a==='renameBrand'){const n=prompt('Client name',b.name);if(n)b.name=n.trim();const d=prompt('Short note (optional)',b.notes||'');if(d!==null)b.notes=d}

  else if(a==='addColor'){const name=$('#cn').value.trim(),hex=normHex($('#ch').value||$('#cp').value);if(!name||!hex){toast('Enter a name and a valid HEX');return}b.colors.push({id:uid(),name,hex,role:$('#cr').value})}
  else if(a==='editColor'){const c=b.colors.find(x=>x.id===id),n=prompt('Name',c.name);if(n)c.name=n;const h=prompt('HEX',c.hex);if(h&&normHex(h))c.hex=normHex(h)}
  else if(a==='delColor'){b.colors=b.colors.filter(x=>x.id!==id)}
  else if(a==='copyAll'){copy(b.colors.map(c=>c.hex).join(' '));return}
  else if(a==='copyCss'){copy(':root{\n'+b.colors.map(c=>`  --${b.name.toLowerCase().replace(/\W+/g,'-')}-${c.name.toLowerCase().replace(/\W+/g,'-')}: ${c.hex};`).join('\n')+'\n}');return}
  else if(a==='ase'){download(b.name+' swatches.ase',[makeASE(b.colors)],'application/octet-stream');return}
  else if(a==='renameLogo'){const l=b.logos.find(x=>x.id===id),n=prompt('Logo name',l.name);if(n)l.name=n}
  else if(a==='delLogo'){b.logos=b.logos.filter(x=>x.id!==id)}
  else if(a==='addFont'){const name=$('#fn').value.trim();if(!name){toast('Enter a font name');return}
    const f={id:uid(),name,role:$('#fr').value,weights:$('#fw').value,url:$('#fu').value.trim()},file=$('#ff').files[0];

document.addEventListener('dragover',e=>{const d=e.target.closest('#drop');if(d){e.preventDefault();d.classList.add('over')}});
document.addEventListener('dragleave',e=>{$('#drop')?.classList.remove('over')});
document.addEventListener('drop',e=>{const d=e.target.closest('#drop');if(d){e.preventDefault();d.classList.remove('over');runCheck([...e.dataTransfer.files])}});
function registerFont(f){try{new FontFace('bf-'+f.id,`url(${f.file})`).load().then(ff=>document.fonts.add(ff)).catch(()=>{})}catch{}}

/* ---------- new brand form ---------- */
const LOGO_GROUPS=['Primary logo','Icon / symbol','Wordmark','Brandmark','Pattern','Other'];
const HEXRE=/#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})\b|\b([0-9a-fA-F]{6})\b/g;
function parseColours(txt,defRole){const out=[];txt.split('\n').forEach(line=>{line=line.trim();if(!line)return;const hs=[...line.matchAll(HEXRE)];
  if(hs.length>1&&line.replace(HEXRE,'').replace(/[\s,;|]/g,'')==='')hs.forEach(m=>{const h=normHex(m[0]);if(h)out.push({id:uid(),name:h,hex:h,role:defRole})});
  else if(hs.length){const h=normHex(hs[0][0]);if(!h)return;const rest=line.replace(HEXRE,' ').split('|').map(x=>x.replace(/^[\s,:;–-]+|[\s,:;–-]+$/g,'')).filter(Boolean);out.push({id:uid(),name:rest[0]||h,hex:h,role:rest[1]?rest[1][0].toUpperCase()+rest[1].slice(1):defRole})}});return out}
function parseFonts(txt){return txt.split('\n').map(l=>l.split('|').map(x=>x.trim())).filter(p=>p[0]).map(p=>({id:uid(),name:p[0],role:p[1]||'Body',weights:p[2]||'',url:p[3]||''}))}
/* ---------- boot ---------- */
(async()=>{try{const s=await DB.get('state');if(s?.brands)S=s}catch{}
  /* signed in through the server: shared brands (srv: true = server has brands, false = server empty, null = local mode / unreachable) */
  let srv=null;
  if(!DEMO&&typeof LHsync!=='undefined'&&LHsync.init()){try{srv=await LHsync.load()}catch(e){LHsync.on=false;toast('Server not reachable – showing your last saved copy')}}
  S.brands.forEach(b=>b.fonts.forEach(f=>f.file&&registerFont(f)));
  if(DEMO&&!S.brands.length){loadDemo();return}
  if(!DEMO&&srv!==true){try{const r=await fetch('brand-hub-data.json?v='+Date.now());if(r.ok){const j=await r.json();if(!S.brands.length||(S.version||0)<(j.version||0)){const old=S.brands,keep=old.filter(b=>b.user),ue={};old.forEach(b=>{const u=(b.elements||[]).filter(e=>e.user);if(u.length)ue[b.name]=u});
      S=j;S.brands=S.brands.map(nb=>{const o=old.find(x=>x.name===nb.name&&!x.user);if(o&&o.edited)return o;if(ue[nb.name])nb.elements=[...(nb.elements||[]),...ue[nb.name]];return nb});S.brands.push(...keep);S.brands.forEach(b=>b.fonts.forEach(f=>f.file&&registerFont(f)));save()}}}catch{}}
  if(srv===false){LHsync.ver={};LHsync.hash={};LHsync.flush()}   /* server is empty: publish what we have */
  ui.brandId=S.brands[0]?.id||null;ui.anim=true;render();
})();
</script>
</body>
